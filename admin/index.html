<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetheria — Admin Poem Studio</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#07080c">

  <!-- Google Fonts: Cormorant Garamond & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
</head>
<body class="theme-midnight">

  <!-- Atmospheric Background Elements -->
  <div id="ambient-blobs" class="ambient-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div class="vignette-overlay" aria-hidden="true"></div>
  <div class="grain-overlay" aria-hidden="true"></div>

  <main class="admin-portal">

    <!-- SECTION 1: Passcode Authentication (Shown when locked) -->
    <section id="auth-section" class="admin-auth-card">
      <div class="modal-card modal-card-sm" style="animation: none;">
        <div class="modal-header">
          <div class="modal-title-wrap">
            <svg class="icon modal-lead-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <h2>Admin Authentication</h2>
          </div>
        </div>

        <form id="admin-auth-form" class="modal-form">
          <div class="form-group">
            <label for="admin-pass-input">Enter Passcode to Access Studio</label>
            <input type="password" id="admin-pass-input" placeholder="Enter admin passcode..." autocomplete="current-password" required autofocus>
            <span class="field-hint">Default passcode: <code>admin</code></span>
          </div>
          
          <div id="auth-error-msg" class="modal-feedback" style="display: none;"></div>
          
          <div class="modal-actions">
            <button type="submit" class="action-btn primary-btn" style="width: 100%;">Unlock Studio</button>
          </div>

          <div style="text-align: center; margin-top: 1.25rem;">
            <a href="../" class="back-home-link">← Return to Public Sanctuary</a>
          </div>
        </form>
      </div>
    </section>

    <!-- SECTION 2: Admin Poem Studio Dashboard (Shown when unlocked) -->
    <section id="studio-section" style="width: 100%; display: flex; flex-direction: column; align-items: center;" hidden>
      
      <!-- Top Navigation Row -->
      <nav class="admin-nav-bar" aria-label="Admin Navigation">
        <div class="admin-nav-brand">
          <span class="gem">✦</span>
          <span>Aetheria Poem Studio</span>
          <span class="badge-live" style="margin-left: 0.25rem;">Admin</span>
        </div>
        <div class="admin-nav-links">
          <a href="../" class="admin-nav-link" title="Open public homepage in new or current tab">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 15px; height: 15px;">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
              <polyline points="15 3 21 3 21 9"/>
              <line x1="10" y1="14" x2="21" y2="3"/>
            </svg>
            <span>View Homepage</span>
          </a>
          <button type="button" id="lock-btn" class="action-btn secondary-btn small-btn" title="Lock admin studio and require passcode">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px; margin-right: 0.35rem;">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <span>Lock</span>
          </button>
        </div>
      </nav>

      <!-- Main Studio Glass Card -->
      <div class="admin-studio-card">

        <!-- VIEW A: Poem Collection Library -->
        <div id="poem-library-view" class="admin-view active">
          <div class="library-header-row">
            <div>
              <h3 class="view-heading">Poem Collection</h3>
              <p class="view-sub">Choose which poem is displayed live on the homepage, or add new timeless verses.</p>
            </div>
            <button type="button" id="admin-create-new-btn" class="action-btn primary-btn create-new-btn">
              <span>+ Create Poem</span>
            </button>
          </div>

          <div id="admin-poem-list" class="admin-poem-list" style="max-height: 52vh;">
            <!-- Populated dynamically by admin.js -->
          </div>
        </div>

        <!-- VIEW B: Poem Editor Form (Create / Edit) -->
        <div id="poem-editor-view" class="admin-view" hidden>
          <div class="editor-header-row">
            <button type="button" id="back-to-library-btn" class="back-link-btn">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
              </svg>
              <span>Back to Collection</span>
            </button>
            <span id="editor-mode-label" class="editor-mode-label">New Poem</span>
          </div>

          <form id="poem-edit-form" class="modal-form">
            <input type="hidden" id="editing-poem-id" value="">
            
            <div class="form-row">
              <div class="form-group flex-1">
                <label for="poem-title-input">Poem Title</label>
                <input type="text" id="poem-title-input" placeholder="e.g. The Road Not Taken" required maxlength="120">
              </div>
              <div class="form-group flex-1">
                <label for="poem-author-input">Poet / Author</label>
                <input type="text" id="poem-author-input" placeholder="e.g. Robert Frost" required maxlength="80">
              </div>
            </div>

            <div class="form-group">
              <label for="poem-body-input">Poem Verses (Leave an empty line between stanzas)</label>
              <textarea id="poem-body-input" rows="9" placeholder="Write or paste your poem lines here...&#10;&#10;Separate stanzas with an empty line." required></textarea>
            </div>

            <div class="form-group-checkbox">
              <label class="checkbox-label">
                <input type="checkbox" id="set-live-checkbox" checked>
                <span>Share and display this poem on homepage immediately</span>
              </label>
            </div>

            <div class="modal-actions-between">
              <button type="button" id="cancel-edit-btn" class="action-btn secondary-btn">Cancel</button>
              <button type="submit" class="action-btn primary-btn">Save Poem</button>
            </div>
          </form>
        </div>

        <!-- Security & Passcode Section -->
        <div class="admin-security-section" style="margin-top: 2rem;">
          <details class="admin-passcode-details">
            <summary>Admin Security & Passcode</summary>
            <div class="form-group inline-pass-change">
              <input type="password" id="new-admin-pass" placeholder="New admin passcode">
              <button type="button" id="save-new-pass-btn" class="action-btn secondary-btn">Update Passcode</button>
              <button type="button" id="reset-library-btn" class="action-btn secondary-btn" title="Clear all poems in collection">Clear All Poems</button>
            </div>
          </details>
        </div>

      </div> <!-- End .admin-studio-card -->

    </section>

  </main>

  <!-- Continuous Background Audio (Always On & Looping) -->
  <audio id="local-audio" src="../song.mp3" autoplay loop preload="auto"></audio>

  <!-- Autoplay Security Guard: Subtle Unlock Hint if Browser Restricts Sound -->
  <div id="audio-unlock-hint" class="audio-unlock-hint" hidden role="button" aria-label="Enable ambient sound">
    <span>♪ Click anywhere to enable ambient music</span>
  </div>

  <!-- Toast Notification Feedback -->
  <div id="toast" class="toast-notice" role="status" aria-live="polite" hidden>
    <span id="toast-message"></span>
  </div>

  <script src="admin.js"></script>
</body>
</html>
